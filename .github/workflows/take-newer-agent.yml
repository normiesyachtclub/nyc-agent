# Takes the agent.js the club publishes, when you press Run workflow. Nothing runs it by itself: this file
# signs with your key, so a newer one is your decision. It takes the file only if it matches the checksum the
# club publishes (https://normiesyachtclub.com/agent/agent.sha256.txt), and it changes no other file.
name: Take the newer agent.js
on:
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  take:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Take the published agent.js, only if it matches its published checksum
        run: |
          curl -fsSL https://normiesyachtclub.com/agent/agent.js -o agent.new.js
          want=$(curl -fsSL https://normiesyachtclub.com/agent/agent.sha256.txt | cut -d" " -f1)
          got=$(sha256sum agent.new.js | cut -d" " -f1)
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "  The published file and its published checksum disagree. Nothing was changed."; rm -f agent.new.js; exit 1
          fi
          if cmp -s agent.new.js agent.js; then echo "  agent.js is already the published one."; rm -f agent.new.js; exit 0; fi
          mv agent.new.js agent.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent.js
          git commit -m "agent.js: the club's published file, sha256 $got"
          git push
          echo "  Done. Your agent uses the new agent.js from its next run."
      - name: Close the issue that asked
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "A newer agent.js is published in:title" --json number --jq ".[].number"); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Taken: agent.js is the one the club publishes now."
          done
