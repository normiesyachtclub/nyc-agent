# START ITS CLOCK, ONCE: type any word at the end of the next line, then press Commit changes, and Commit changes again.
# Clock started by:
#
# (GitHub starts the hourly runs of a new copy only once this file has been changed in it. Measured 24 Sep 2026: a copy
# made from the template ran only when its Run button was pressed, for hours, and ran by itself within two hours
# of a one-word change here. Within two hours of yours, Actions shows a run marked "Scheduled": that is your agent.)
#
# Your agent, every hour, on GitHub's machines, so it works while your computer is off.
# It is your repository and your key: the club never sees either, and runs none of this.
#
# Set up: Actions -> Set up my agent -> Run workflow (that writes your orders for you). Every orders
# file here runs: orders.json for the wallet, and orders-<yacht>.json for each yacht of your crew.
# If your job ACTS: Settings -> Secrets and variables -> Actions -> New repository secret,
# named NYC_AGENT_KEY, holding the LAST line of agent-key.txt (0x and 64 more characters). Never commit that key here.
# To stop it: disable this workflow in the Actions tab, and revoke the key on The Purser.
name: NYC agent
on:
  schedule:
    - cron: "23 * * * *"   # every hour, at 23 minutes past (about 720 of your 2,000 free minutes a month). Change it if you like.
  workflow_dispatch: {}     # the Run workflow button
permissions:
  contents: read
  issues: write
  actions: read             # only to see whether this repository has had a run marked Scheduled yet
concurrency:
  group: nyc-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Before anything: a repository nobody has set up yet says so, once, and stops. A red cross
      # every morning for a thing the member has not done yet teaches them to ignore the mail.
      - name: Have you set it up?
        id: ready
        run: |
          found=no
          for f in orders*.json; do [[ "$f" =~ ^orders(-[0-9]+)?\.json$ ]] && found=yes; done
          if [ "$found" = no ]; then
            echo "  No orders yet. Actions -> Set up my agent -> Run workflow, and this starts working within the hour."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      # What your agent already told you and already spent, carried from one day to the next, per file.
      - if: steps.ready.outputs.go == 'yes'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            orders*.posted.json
            orders*.ledger.json
            orders*.calls.json
            orders*.mess.json
          key: nyc-agent-${{ github.run_id }}
          restore-keys: nyc-agent-
      - name: The one thing it needs in order to sign
        if: steps.ready.outputs.go == 'yes'
        run: npm install ethers@6.17.0 --no-save --no-audit --no-fund --loglevel=error
      - name: Your agent
        if: steps.ready.outputs.go == 'yes'
        env:
          NYC_AGENT_KEY: ${{ secrets.NYC_AGENT_KEY }}
          # Only if your orders name a brain: the service's key as a secret, its address and model as variables.
          NYC_BRAIN_KEY: ${{ secrets.NYC_BRAIN_KEY }}
          NYC_BRAIN_URL: ${{ vars.NYC_BRAIN_URL }}
          NYC_BRAIN_MODEL: ${{ vars.NYC_BRAIN_MODEL }}
        run: |
          failed=0
          for f in orders*.json; do
            [[ "$f" =~ ^orders(-[0-9]+)?\.json$ ]] || continue
            echo "::group::$f"
            node agent.js "$f" --send || { failed=1; echo "  $f did not finish. Its lines above say why."; }
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Tell you
        if: always() && steps.ready.outputs.go == 'yes' && hashFiles('orders*.news.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for f in orders*.news.txt; do [ -f "$f" ] && { cat "$f"; echo; }; done \
            | awk '/^Read from the live club/ { if (r++) next } NF == 0 || !seen[$0]++' > body.txt
          # A run started by hand says whether the clock is on: a green run of your own proves the job, never the clock.
          # "0" only when GitHub answered and there is no Scheduled run; a failed read says nothing rather than guess.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            scheduled=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nyc-agent.yml --event schedule --limit 1 --json databaseId --jq 'length' 2>/dev/null || echo "?")
            if [ "$scheduled" = "0" ]; then
              printf '%s\n\n' "You started this run by hand, and your agent has not yet run by itself here. If you have not started its clock: open $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/edit/$GITHUB_REF_NAME/.github/workflows/nyc-agent.yml, type any word at the end of the line \"# Clock started by:\", then press Commit changes, and Commit changes again. Within two hours Actions shows a run marked Scheduled: from then on it runs every hour by itself." >> body.txt
            fi
          fi
          echo "@$OWNER this is your agent. Close this issue whenever you like." >> body.txt
          title="Your agent: news for $(date -u +%F)"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq '.[] | "\(.number)\t\(.title)"' | awk -F'\t' -v t="$title" '$2 == t { print $1; exit }')
          if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file body.txt
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.txt; fi
      # ☠ NOTHING HERE EVER REPLACES agent.js. This file signs with your key, so a newer one is your
      # decision, never ours: the club publishes a checksum, this compares it, and tells you.
      - name: Is a newer agent published?
        if: always() && steps.ready.outputs.go == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mine=$(sha256sum agent.js | cut -d" " -f1)
          theirs=$(curl -fsSL https://normiesyachtclub.com/agent/agent.sha256.txt | cut -d" " -f1 || echo "")
          if [ -n "$theirs" ] && [ "$mine" != "$theirs" ]; then
            title="A newer agent.js is published"
            if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq ".[0].number")" ]; then
              if [ -f .github/workflows/take-newer-agent.yml ]; then
                how="To take it, open $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/take-newer-agent.yml and press Run workflow, then Run workflow again. It takes the file only if it matches the checksum the club publishes."
              else
                how="To take it: download https://normiesyachtclub.com/agent/agent.js and replace agent.js here."
              fi
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The club has published a newer agent.js. Yours still works. $how Nothing updates itself, because this file signs with your key: taking it is your decision."
            fi
          fi
